spring:
#  aop:
#    auto: true
#    proxy-target-class: false

  config:
    activate:
      on-profile: dev
  task:
    execution:
      pool:
        core-size: 8
    scheduling:
      pool:
        size: 3
  flyway:
    enabled: true
    user: sa
    password: sa
    encoding: UTF-8
    batch: true
    create-schemas: true
    schemas: OMS_ZF
    table: flyway_schema_history
    locations:
      - classpath:db/migration
    # 第一次迁移时，在非空的schema(即已经存在数据表结构的数据库中，应用flyway)，是否创建基线
    baseline-on-migrate: true
    # 当在非空schema中创建基线时，对应的基线版本
    baseline-version: 1
#    target: 3?
    validate-on-migrate: true
    validate-migration-naming: false

  datasource:
    embedded-database-connection: h2
    hikari:
      driver-class-name: org.h2.Driver
      # jdbc:h2:mem:dbtest 内存模式.每次启动都要初始化
      # jdbc:h2:file:${user.dir}/db/test 文件模式
      jdbc-url: jdbc:h2:file:${user.dir}/db/test
      schema: OMS_ZF
      username: sa
      password: sa
      maximum-pool-size: 3
# 需要是 web servlet应用，配置才有效，才可以通过url访问数据库
#  h2:
#    console:
#      enabled: true
#      path: /h2
#      settings:
#        web-allow-others: true

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml

logging:
  charset:
    file: UTF-8
  config: classpath:logback-spring.xml
#  file:
#    name: ${user.dir}/log/app.log
#    path: ${user.dir}/log/
  level:
    root: debug
#    sql: debug
#  logback:
#    rollingpolicy:
#      max-file-size: 100MB
#      max-history: 7

data:
  json:
    substation: classpath:/data/substation.json
